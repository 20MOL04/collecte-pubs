name: Classeur IA
# Pub Track v2, lot 3 (29/10/2026) : le vrai nom du produit, son type (physique, digital, saas) et la qualite
# de la pub, lus sur l'image par un modele de vision. Tache A PART de la collecte : aucun navigateur, aucune
# lecture Meta, son propre groupe. Elle passe apres le dernier creneau de la nuit (04 h 37).
#
# Modele : Claude Haiku 5.5, effort low (17/11/2026, Pub Track quitte Gemini). Une requete toutes les 7 s au plus ;
# une cle refusee, un debit (429) ou un solde epuise arrete la tache, 5 echecs de suite aussi ; elle reprend la nuit
# suivante. Le cout range est le releve d'Anthropic, echecs factures compris. Sans ANTHROPIC_API_KEY, rien n'est fait.
# Les decoupes des produits vont dans Cloudflare R2 (15/11/2026) : sans les secrets R2_*, la tache s'arrete.
on:
  schedule:
    - cron: "47 5 * * *"
  # Lancement a la main (07/11/2026) : passer le stock deja en base. Un refus de debit ou de solde arrete la tache,
  # qui reprend la nuit suivante.
  workflow_dispatch:
    inputs:
      max:
        description: "Pubs a classer au plus (vide = 600, le budget de nuit ; ex. 3000 pour le stock)."
        required: false
      minutes:
        description: "Minutes au plus (vide = 40 ; 55 au maximum)."
        required: false
concurrency:
  group: classeur
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  classer:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Classer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Les miniatures se lisent dans R2, les decoupes des produits y sont deposees (15/11/2026).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_PUB_TRACK: ${{ secrets.R2_BUCKET_PUB_TRACK }}
          R2_URL_PUBLIQUE_PUB_TRACK: ${{ secrets.R2_URL_PUBLIQUE_PUB_TRACK }}
          MAX: ${{ github.event.inputs.max }}
          MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          ARGS=""
          case "$MAX$MINUTES" in *[!0-9]*) echo "max et minutes : des nombres seulement" >&2; exit 1;; esac
          if [ -n "$MAX" ]; then ARGS="$ARGS --max $MAX"; fi
          if [ -n "$MINUTES" ]; then ARGS="$ARGS --minutes $(( MINUTES > 55 ? 55 : MINUTES ))"; fi
          npx tsx scripts/pub-track/classer-produits.ts $ARGS
