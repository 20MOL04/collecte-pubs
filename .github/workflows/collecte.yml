name: Collecte de nuit
# Collecte de nuit des pubs publiques. Depot public : minutes GitHub Actions gratuites et illimitees.
#
# Pub Track v2, lot 1 (29/10/2026) : la nuit en CRENEAUX COURTS (six depuis le lot 2, la verification relit 150 annonceurs) au lieu d'une heure d'affilee.
# Le 29/10, Meta a repondu 403 des la premiere recherche et la nuit a lu 0 pub. Chaque creneau lit Meta
# ~15 minutes puis s'arrete ; le suivant reprend la file de la nuit (memoire des
# recherches). Un 403 arrete la nuit entiere : un refus se respecte. Minutes decalees, jamais a l'heure pile : GitHub retarde les crons pleins (le cron de
# 01 h 00 partait entre 06 h 08 et 06 h 55).
on:
  schedule:
    - cron: "7 21 * * *"
    - cron: "37 22 * * *"
    - cron: "7 0 * * *"
    - cron: "37 1 * * *"
    - cron: "7 3 * * *"
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      pays:
        description: "Pays (ex. CI,SN,CM). Vide = un creneau de la nuit, qui reprend la file."
        required: false
      mots:
        description: "Mots-cles (ex. savon,creme). Vide = la rotation."
        required: false
      depuis:
        description: "Rattrapage : seulement les pubs lancees depuis N jours (ex. 30). Vide = le melange de nuit."
        required: false
      mots_par_pays:
        description: "Mots-cles par pays (ex. 12). Vide = le budget de nuit."
        required: false
# UN SEUL groupe pour tout le depot : jamais deux navigateurs vers Meta en meme temps, creneaux et
# lancements a la main confondus. La ligne de journal en base fait le meme verrou entre les depots.
concurrency:
  group: collecte-meta
  cancel-in-progress: false
jobs:
  collecter:
    runs-on: ubuntu-latest
    # Un creneau ~25 min (installation, ~15 de Meta, rangement) ; un lancement a la main par pays jusqu'a 58.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Collecter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAYS: ${{ github.event.inputs.pays }}
          MOTS: ${{ github.event.inputs.mots }}
          DEPUIS: ${{ github.event.inputs.depuis }}
          MOTS_PAR_PAYS: ${{ github.event.inputs.mots_par_pays }}
        # Aucune depense : ni Gemini (nommage) ni ScrapeCreators (TikTok). Seules les pubs Meta, gratuites.
        # Sans pays ni mots (cron, ou lancement a la main vide) : un creneau de la nuit.
        run: |
          ARGS="--sans-tiktok"
          if [ -z "$PAYS" ] && [ -z "$MOTS" ]; then ARGS="$ARGS --creneau"; fi
          if [ -n "$PAYS" ]; then ARGS="$ARGS --pays $PAYS"; fi
          if [ -n "$MOTS" ]; then ARGS="$ARGS --mots $MOTS"; fi
          if [ -n "$DEPUIS" ]; then ARGS="$ARGS --depuis $DEPUIS"; fi
          if [ -n "$MOTS_PAR_PAYS" ]; then ARGS="$ARGS --mots-par-pays $MOTS_PAR_PAYS"; fi
          npx tsx scripts/pub-track/collecter.ts $ARGS
